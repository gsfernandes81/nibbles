[project]
name = "nibbles"
version = "0.3.0"
description = "Queue YouTube videos and file downloads on your phone, and fetch them with data that would otherwise expire"
requires-python = ">=3.11"
# Deliberately empty for now. ytq shells out to the yt-dlp *binary* on PATH
# rather than importing it, and everything else is stdlib. quota_widget is
# reached as the zwana-quota CHECKOUT (~/zwana-quota or $ZWANA_HOME), never as
# an installed package, so installing this pulls nothing from the internet.
dependencies = []

[project.scripts]
# Both resolve the queue root (this checkout, or $EXPIRE_HOME) rather than
# trusting __file__, so an installed copy still queues into, and manages, the
# real queue. ytq and dlq were two repos until 2026-10-10; the commands keep
# their names until the one-app shell replaces them.
ytq = "ytq:main"
dlq = "expire_sched:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat sibling modules, not a package: they import each other by bare name and
# the queue items written into queue/ do the same, so the whole directory has
# to land on sys.path as one unit.
only-include = [
    "dlq.py",
    "expire_dl.py",
    "expire_runner.py",
    "expire_sched.py",
    "expire_ui.py",
    "ytdl_item.py",
    "ytq.py",
]
sources = ["."]
# Editable installs get a .pth for this directory instead of per-module
# shims, which keeps `import expire_dl` working the same way the runtime
# sys.path.insert calls already assume.
dev-mode-dirs = ["."]

# Two groups, not one — the or3 repo's uv plan (docs/uv-dev-env.md there),
# applied here. `uv sync` installs dev (pytest is pure Python and installs
# anywhere, the phone included); lint is separate because a plain sync must
# NOT drag ruff onto a machine that has it natively — Termux ships a native
# aarch64 ruff, and uv cannot install ruff on Android (neither manylinux nor
# musllinux). The pin is Termux's own version, so a lint count measured in
# the container describes what the phone will see.
[dependency-groups]
# pyte is a terminal emulator in pure Python, and it is here for one reason:
# the front ends ARE their screens, and the failures worth catching — a page
# that leaves when it should stay, a sentence clipped over the keys — are only
# visible on one. The suite opens the real screen on a pty and reads what a
# terminal would have shown. Pure Python, so it installs on the phone too.
dev = [
    "hypothesis>=6.167.1",
    "pyte>=0.8.2",
    "pytest>=8",
]
lint = ["ruff==0.16.4"]
mutants = [
    "poodle>=1.3.4",
]

# Two suites, one per former repo, each with a conftest that builds its own
# throwaway queue root and imports the modules out of THAT copy — never out of
# this checkout, whose expire_runner would root itself here. They are run as
# two pytest processes (.githooks/checks.sh), because each conftest owns the
# environment and sys.modules for its whole session. No `pythonpath` here on
# purpose: putting this checkout on sys.path is exactly what must not happen.
[tool.pytest.ini_options]
testpaths = ["tests/ytq", "tests/dlq"]
markers = ["tui: drives the curses screens under a pty"]

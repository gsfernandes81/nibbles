[project]
name = "nibbles"
version = "0.4.0"
description = "Queue YouTube videos and file downloads on your phone, and fetch them with data that would otherwise expire"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Gavin Fernandes" }]
keywords = ["termux", "youtube", "yt-dlp", "download", "queue", "metered", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
# ytq shells out to the yt-dlp *binary* on PATH rather than importing it, and
# quota_widget is reached as the zwana-quota CHECKOUT (~/zwana-quota or
# $ZWANA_HOME), never as an installed package — a manual budget needs none.
# blessed owns the terminal; bewitch draws the screens (a checkout of it beside
# this one, or under ~, still wins: tui._bewitch_root).
dependencies = [
    "bewitch>=0.1.0",
    "blessed>=1.50",
]

[project.urls]
Source = "https://github.com/gsfernandes81/nibbles"
Issues = "https://github.com/gsfernandes81/nibbles/issues"
Documentation = "https://github.com/gsfernandes81/nibbles/tree/main/docs"

[project.scripts]
# One command (2026-10-10); every word ytq and dlq took is a word `nibbles`
# takes (`nibbles help`). It resolves the queue root (nibbles.home: this
# checkout, $EXPIRE_HOME, else ~/nibbles) rather than trusting __file__, so an
# installed copy still queues into, and manages, the real queue.
nibbles = "nibbles:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package since 2026-10-10. The flat files at the checkout's root are
# doors for a phone that predates it (see their docstrings) and do not ship.
packages = ["nibbles"]
# Editable installs get a .pth for the checkout, so `import nibbles` is the
# checkout's package, edits take effect at once and a pull needs no reinstall.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
# The item contract, which an installed copy writes into the queue root it
# makes on first run (nibbles.home.ensure) — it is also what marks one.
"queue/README.md" = "nibbles/queue-README.md"

[tool.hatch.build.targets.sdist]
include = [
    "nibbles",
    "queue/README.md",
    "tests",
    "docs",
    "completions",
    "README.md",
    "LICENSE",
    "CLAUDE.md",
]

[tool.uv.sources]
# For development the sibling checkout, which the suites already need; the
# wheel's metadata says only `bewitch>=0.1.0`, which PyPI answers.
bewitch = { path = "../bewitch", editable = true }

# Two groups, not one — the or3 repo's uv plan (docs/uv-dev-env.md there),
# applied here. `uv sync` installs dev (pytest is pure Python and installs
# anywhere, the phone included); lint is separate because a plain sync must
# NOT drag ruff onto a machine that has it natively — Termux ships a native
# aarch64 ruff, and uv cannot install ruff on Android (neither manylinux nor
# musllinux). The pin is Termux's own version, so a lint count measured in
# the container describes what the phone will see.
[dependency-groups]
# pyte is a terminal emulator in pure Python, and it is here for one reason:
# the front ends ARE their screens, and the failures worth catching — a page
# that leaves when it should stay, a sentence clipped over the keys — are only
# visible on one. The suite opens the real screen on a pty and reads what a
# terminal would have shown. Pure Python, so it installs on the phone too.
dev = [
    "hypothesis>=6.167.1",
    "pyte>=0.8.2",
    "pytest>=8",
]
lint = ["ruff==0.16.4"]
mutants = [
    "poodle>=1.3.4",
]

# Two suites, one per former repo, each with a conftest that builds its own
# throwaway queue root and imports the modules out of THAT copy — never out of
# this checkout, whose expire_runner would root itself here. They are run as
# two pytest processes (.githooks/checks.sh), because each conftest owns the
# environment and sys.modules for its whole session. No `pythonpath` here on
# purpose: putting this checkout on sys.path is exactly what must not happen.
[tool.pytest.ini_options]
testpaths = ["tests/ytq", "tests/dlq"]
markers = ["tui: drives the curses screens under a pty"]
